<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Desa Seburing Hilir</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #1b5e20;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #2e7d32;
            padding: 12px;
            text-align: center;
            position: relative;
            z-index: 999;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background 0.3s;
        }
        nav a:hover {
            background-color: #1b5e20;
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #2e7d32;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #1b5e20;
        }
    </style>
</head>
<body>

    <header>
        <h1>Website Resmi Desa Seburing Hilir</h1>
    </header>

    <nav>
        <a href="index.html">Beranda</a>
        <a href="kontak.html">Kontak</a>
    </nav>

    <div class="container">
        <h2>Hubungi Kami</h2>
        <form>
            <div class="form-group">
                <label>Nama Lengkap:</label>
                <input type="text" placeholder="Masukkan nama Anda..." required>
            </div>
            <div class="form-group">
                <label>Pesan:</label>
                <textarea rows="4" placeholder="Tuliskan pesan Anda..." required></textarea>
            </div>
            <button type="submit">Kirim Pesan</button>
        </form>
    </div>

</body>
</html>
