<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Desa Seburing Hilir</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f7f4;
}

/* =========================
   LOGIN
========================= */

.login-page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #dff4e5, #ffffff);
}

.login-box {
    width: 380px;
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
}

.login-box h1 {
    text-align: center;
    color: #287a45;
    margin-bottom: 8px;
}

.login-box p {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
}

textarea {
    height: 120px;
    resize: vertical;
}

button {
    cursor: pointer;
}

.login-btn {
    width: 100%;
    padding: 13px;
    background: #287a45;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}

#error {
    text-align: center;
    color: red;
    margin-top: 12px;
}


/* =========================
   DASHBOARD
========================= */

#dashboard {
    display: none;
}

.navbar {
    background: #287a45;
    color: white;
    padding: 18px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logout {
    background: white;
    color: #287a45;
    border: none;
    padding: 9px 17px;
    border-radius: 7px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 30px;
}

.welcome {
    background: white;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 25px;
}

.welcome h1 {
    color: #287a45;
    margin-bottom: 8px;
}


/* =========================
   MENU
========================= */

.menu {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.menu button {
    border: none;
    background: white;
    padding: 20px;
    border-radius: 12px;
    font-size: 15px;
    color: #287a45;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

.menu button:hover {
    background: #e5f4e9;
}


/* =========================
   FORM
========================= */

.form-box {
    display: none;
    background: white;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
}

.form-box h2 {
    color: #287a45;
    margin-bottom: 20px;
}

.save-btn {
    background: #287a45;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
}

.back-btn {
    background: #ddd;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    margin-left: 5px;
}

.message {
    margin-top: 15px;
    font-weight: bold;
}


/* =========================
   PESAN MASUK
========================= */

.pesan-card {
    background: #f3f7f4;
    padding: 18px;
    margin-bottom: 15px;
    border-radius: 10px;
    border-left: 5px solid #287a45;
}

.pesan-card strong {
    color: #287a45;
}

.pesan-card p {
    margin-top: 8px;
    line-height: 1.6;
}

.pesan-card small {
    color: #777;
}

.loading {
    text-align: center;
    padding: 20px;
    color: #777;
}

.no-pesan {
    text-align: center;
    padding: 25px;
    color: #777;
}

.error-pesan {
    text-align: center;
    padding: 20px;
    color: red;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width: 800px) {

    .menu {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media(max-width: 500px) {

    .menu {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 15px;
    }

    .navbar {
        padding: 15px;
    }

    .navbar h2 {
        font-size: 16px;
    }

}

</style>

</head>

<body>


<!-- =================================================
     LOGIN
================================================= -->

<div class="login-page" id="loginPage">

    <div class="login-box">

        <h1>🌿 Admin Desa</h1>

        <p>Desa Seburing Hilir</p>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button
            class="login-btn"
            onclick="login()"
        >
            Login
        </button>

        <div id="error"></div>

    </div>

</div>


<!-- =================================================
     DASHBOARD
================================================= -->

<div id="dashboard">

    <div class="navbar">

        <h2>🌿 Admin Desa Seburing Hilir</h2>

        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <div class="container">


        <!-- WELCOME -->

        <div class="welcome">

            <h1>Dashboard Admin</h1>

            <p>
                Kelola informasi Website Desa Seburing Hilir
                melalui halaman administrator.
            </p>

        </div>


        <!-- =================================================
             MENU
        ================================================= -->

        <div class="menu">

            <button onclick="showForm('profil')">
                🏡
                <br><br>
                Kelola Profil
            </button>


            <button onclick="showForm('potensi')">
                🌱
                <br><br>
                Kelola Potensi
            </button>


            <button onclick="showForm('galeri')">
                📷
                <br><br>
                Kelola Galeri
            </button>


            <button onclick="showForm('kontak')">
                📩
                <br><br>
                Kelola Kontak
            </button>


            <button onclick="tampilkanPesan()">
                💬
                <br><br>
                Pesan Masuk
            </button>

        </div>


        <!-- =================================================
             PESAN MASUK
        ================================================= -->

        <div
            class="form-box"
            id="pesanMasuk"
        >

            <h2>
                💬 Pesan dari Pengunjung
            </h2>


            <div id="daftarPesan">

                <div class="loading">
                    ⏳ Memuat pesan...
                </div>

            </div>


            <button
                class="back-btn"
                onclick="tutupForm()"
            >
                Kembali
            </button>

        </div>


        <!-- =================================================
             PROFIL
        ================================================= -->

        <div
            class="form-box"
            id="profil"
        >

            <h2>
                🏡 Tambah Profil Desa
            </h2>


            <label>Judul</label>

            <input
                type="text"
                id="profilJudul"
                placeholder="Contoh: Tentang Desa Seburing Hilir"
            >


            <label>Isi Profil</label>

            <textarea
                id="profilIsi"
                placeholder="Masukkan informasi profil desa..."
            ></textarea>


            <button
                class="save-btn"
                onclick="simpanProfil()"
            >
                💾 Simpan
            </button>


            <button
                class="back-btn"
                onclick="tutupForm()"
            >
                Kembali
            </button>


            <div
                class="message"
                id="profilMessage"
            ></div>

        </div>


        <!-- =================================================
             POTENSI
        ================================================= -->

        <div
            class="form-box"
            id="potensi"
        >

            <h2>
                🌱 Tambah Potensi Desa
            </h2>


            <label>Nama Potensi</label>

            <input
                type="text"
                id="potensiNama"
                placeholder="Contoh: Koperasi Merah Putih"
            >


            <label>Deskripsi</label>

            <textarea
                id="potensiDeskripsi"
                placeholder="Masukkan deskripsi potensi..."
            ></textarea>


            <label>Link Gambar</label>

            <input
                type="text"
                id="potensiGambar"
                placeholder="Masukkan nama/link gambar"
            >


            <button
                class="save-btn"
                onclick="simpanPotensi()"
            >
                💾 Simpan
            </button>


            <button
                class="back-btn"
                onclick="tutupForm()"
            >
                Kembali
            </button>


            <div
                class="message"
                id="potensiMessage"
            ></div>

        </div>


        <!-- =================================================
             GALERI
        ================================================= -->

        <div
            class="form-box"
            id="galeri"
        >

            <h2>
                📷 Tambah Galeri
            </h2>


            <label>Judul Foto</label>

            <input
                type="text"
                id="galeriJudul"
                placeholder="Contoh: Jembatan Gantung"
            >


            <label>Link Gambar</label>

            <input
                type="text"
                id="galeriGambar"
                placeholder="Masukkan link gambar"
            >


            <label>Keterangan</label>

            <textarea
                id="galeriKeterangan"
                placeholder="Masukkan keterangan foto..."
            ></textarea>


            <button
                class="save-btn"
                onclick="simpanGaleri()"
            >
                💾 Simpan
            </button>


            <button
                class="back-btn"
                onclick="tutupForm()"
            >
                Kembali
            </button>


            <div
                class="message"
                id="galeriMessage"
            ></div>

        </div>


        <!-- =================================================
             KONTAK
        ================================================= -->

        <div
            class="form-box"
            id="kontak"
        >

            <h2>
                📩 Tambah Kontak
            </h2>


            <label>Alamat</label>

            <input
                type="text"
                id="kontakAlamat"
                placeholder="Alamat Desa Seburing Hilir"
            >


            <label>Nomor Telepon</label>

            <input
                type="text"
                id="kontakTelepon"
                placeholder="Nomor telepon"
            >


            <label>Email</label>

            <input
                type="email"
                id="kontakEmail"
                placeholder="Email desa"
            >


            <button
                class="save-btn"
                onclick="simpanKontak()"
            >
                💾 Simpan
            </button>


            <button
                class="back-btn"
                onclick="tutupForm()"
            >
                Kembali
            </button>


            <div
                class="message"
                id="kontakMessage"
            ></div>

        </div>


    </div>

</div>


<script>

/* =================================================
   URL APPS SCRIPT BARU
================================================= */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbw24iM51SJMRa5WsAD2oOAr-hMqmjJzWuV2cIhsSspvgeXAt85iUEOg6an2aaxeDvTaVg/exec";


/* =================================================
   LOGIN
================================================= */

function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;


    if (
        username === "admin" &&
        password === "admin123"
    ) {

        document.getElementById("loginPage")
            .style.display = "none";

        document.getElementById("dashboard")
            .style.display = "block";

    } else {

        document.getElementById("error")
            .innerText =
            "Username atau password salah!";

    }

}


/* =================================================
   LOGOUT
================================================= */

function logout() {

    document.getElementById("dashboard")
        .style.display = "none";

    document.getElementById("loginPage")
        .style.display = "flex";

    document.getElementById("username")
        .value = "";

    document.getElementById("password")
        .value = "";

}


/* =================================================
   TAMPILKAN FORM
================================================= */

function showForm(id) {

    document.querySelectorAll(".form-box")
        .forEach(function(form) {

            form.style.display = "none";

        });


    document.getElementById(id)
        .style.display = "block";

}


/* =================================================
   TUTUP FORM
================================================= */

function tutupForm() {

    document.querySelectorAll(".form-box")
        .forEach(function(form) {

            form.style.display = "none";

        });

}


/* =================================================
   KIRIM DATA
================================================= */

function kirimData(params, messageId) {

    const script =
        document.createElement("script");


    const callback =
        "callback_" + Date.now();


    window[callback] = function(data) {

        document.getElementById(messageId)
            .innerText =
            data.message ||
            "Data berhasil disimpan.";


        delete window[callback];


        if (document.body.contains(script)) {

            document.body.removeChild(script);

        }

    };


    params.callback = callback;


    const query =
        new URLSearchParams(params)
            .toString();


    script.src =
        SCRIPT_URL + "?" + query;


    document.body.appendChild(script);

}


/* =================================================
   TAMPILKAN PESAN DARI GOOGLE SHEETS
================================================= */

function tampilkanPesan() {

    // Sembunyikan semua form
    document.querySelectorAll(".form-box")
        .forEach(function(form) {

            form.style.display = "none";

        });


    // Tampilkan form pesan
    document.getElementById("pesanMasuk")
        .style.display = "block";


    // Loading
    document.getElementById("daftarPesan")
        .innerHTML = `
            <div class="loading">
                ⏳ Memuat pesan...
            </div>
        `;


    const script =
        document.createElement("script");


    const callback =
        "pesanCallback_" + Date.now();


    window[callback] = function(data) {

        const daftar =
            document.getElementById("daftarPesan");


        // Jika gagal
        if (
            !data ||
            data.status !== "success"
        ) {

            daftar.innerHTML = `
                <div class="error-pesan">
                    ❌ Gagal mengambil pesan.
                    <br><br>
                    Pastikan Code.gs sudah di-deploy
                    sebagai versi terbaru.
                </div>
            `;


            delete window[callback];


            if (document.body.contains(script)) {

                document.body.removeChild(script);

            }

            return;

        }


        // Jika belum ada pesan
        if (
            !data.data ||
            data.data.length === 0
        ) {

            daftar.innerHTML = `
                <div class="no-pesan">
                    📭 Belum ada pesan masuk.
                </div>
            `;

        }


        // Jika ada pesan
        else {

            daftar.innerHTML = "";


            // Pesan terbaru ditampilkan paling atas
            data.data.reverse()
                .forEach(function(item) {

                    const kotak =
                        document.createElement("div");


                    kotak.className =
                        "pesan-card";


                    kotak.innerHTML = `

                        <strong>
                            👤 ${escapeHTML(item.nama)}
                        </strong>

                        <br><br>

                        📧 ${escapeHTML(item.email)}

                        <br><br>

                        <strong>
                            💬 Pesan:
                        </strong>

                        <p>
                            ${escapeHTML(item.pesan)}
                        </p>

                        <small>
                            🕒 ${formatWaktu(item.waktu)}
                        </small>

                    `;


                    daftar.appendChild(kotak);

                });

        }


        delete window[callback];


        if (document.body.contains(script)) {

            document.body.removeChild(script);

        }

    };


    const url =
        SCRIPT_URL +
        "?action=getPesan&callback=" +
        encodeURIComponent(callback);


    script.src = url;


    document.body.appendChild(script);

}


/* =================================================
   FORMAT WAKTU
================================================= */

function formatWaktu(waktu) {

    if (!waktu) {

        return "-";

    }


    const tanggal =
        new Date(waktu);


    if (isNaN(tanggal.getTime())) {

        return waktu;

    }


    return tanggal.toLocaleString("id-ID");

}


/* =================================================
   AMANKAN TEKS
================================================= */

function escapeHTML(text) {

    if (
        text === null ||
        text === undefined
    ) {

        return "";

    }


    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =================================================
   PROFIL
================================================= */

function simpanProfil() {

    const judul =
        document.getElementById("profilJudul")
            .value;

    const isi =
        document.getElementById("profilIsi")
            .value;


    if (!judul || !isi) {

        alert(
            "Judul dan isi profil harus diisi!"
        );

        return;

    }


    kirimData({

        action: "simpanProfil",

        judul: judul,

        isi: isi

    }, "profilMessage");

}


/* =================================================
   POTENSI
================================================= */

function simpanPotensi() {

    const nama =
        document.getElementById("potensiNama")
            .value;


    const deskripsi =
        document.getElementById("potensiDeskripsi")
            .value;


    const gambar =
        document.getElementById("potensiGambar")
            .value;


    if (!nama || !deskripsi) {

        alert(
            "Nama dan deskripsi harus diisi!"
        );

        return;

    }


    kirimData({

        action: "simpanPotensi",

        nama: nama,

        deskripsi: deskripsi,

        gambar: gambar

    }, "potensiMessage");

}


/* =================================================
   GALERI
================================================= */

function simpanGaleri() {

    const judul =
        document.getElementById("galeriJudul")
            .value;


    const gambar =
        document.getElementById("galeriGambar")
            .value;


    const keterangan =
        document.getElementById("galeriKeterangan")
            .value;


    if (!judul || !gambar) {

        alert(
            "Judul dan gambar harus diisi!"
        );

        return;

    }


    kirimData({

        action: "simpanGaleri",

        judul: judul,

        gambar: gambar,

        keterangan: keterangan

    }, "galeriMessage");

}


/* =================================================
   KONTAK
================================================= */

function simpanKontak() {

    const alamat =
        document.getElementById("kontakAlamat")
            .value;


    const telepon =
        document.getElementById("kontakTelepon")
            .value;


    const email =
        document.getElementById("kontakEmail")
            .value;


    if (
        !alamat ||
        !telepon ||
        !email
    ) {

        alert(
            "Semua data kontak harus diisi!"
        );

        return;

    }


    kirimData({

        action: "simpanKontak",

        alamat: alamat,

        telepon: telepon,

        email: email

    }, "kontakMessage");

}

</script>

</body>
</html>
